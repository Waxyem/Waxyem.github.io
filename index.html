<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Моя первая страница</title>
</head>
<body>
    <h1>Авторизация и база данных Firebase</h1>
    
    <!-- Кнопка и инфо для входа через GitHub -->
    <button id="login-btn">Войти через GitHub</button>
    <div id="user-info" style="margin-top: 10px;"></div>
    <hr>

    <!-- Кнопки для работы с БД -->
    <button id="write-btn">Записать в БД</button>
    <button id="read-btn">Прочитать из БД</button>
    <pre id="db-data" style="background: #f0f0f0; padding: 10px; margin-top: 10px;"></pre>
    <!-- Кнопки входа и выхода -->
<button id="login-btn">Войти через GitHub</button>
<button id="logout-btn" style="display: none;">Выйти из аккаунта</button>
<div id="user-info" style="margin-top: 10px;"></div>
<hr>
    <hr>
    <a href="https://developer.mozilla.org/ru/docs/Web/HTML">Учить HTML на MDN</a>

    <script type="module">
      // 1. Импортируем все необходимые функции из Firebase SDK
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
      import {   getAuth, signInWithPopup, GithubAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

      // Конфигурация вашего проекта
      const firebaseConfig = {
        apiKey: "AIzaSyDIaQ9AHvRAyiXxnr1Ltgoba5LLREuJSU4",
        authDomain: "hot4tv-8e491.firebaseapp.com",
        databaseURL: "https://hot4tv-8e491-default-rtdb.firebaseio.com",
        projectId: "hot4tv-8e491",
        storageBucket: "hot4tv-8e491.firebasestorage.app",
        messagingSenderId: "1063472164821",
        appId: "1:1063472164821:web:daf445b54cca1e326a175c",
        measurementId: "G-ZS96YNYM6Y"
      };

      // 2. Инициализируем сервисы (порядок важен!)
      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const auth = getAuth(app);
      const provider = new GithubAuthProvider();
      const db = getDatabase(app); // Теперь база данных успешно инициализирована


      // Элементы интерфейса
      const loginBtn = document.getElementById("login-btn");
      const userInfoDiv = document.getElementById("user-info");

      // Вход через GitHub
      loginBtn.addEventListener("click", () => {
        signInWithPopup(auth, provider)
          .then((result) => {
            const user = result.user;
            userInfoDiv.innerHTML = `
              <h3>Добро пожаловать, ${user.displayName || 'Пользователь'}!</h3>
              <p>Email: ${user.email}</p>
              <img src="${user.photoURL}" alt="Avatar" width="100">
            `;
            console.log("Данные пользователя:", user);
          })
          .catch((error) => {
            console.error("Ошибка при авторизации:", error);
            userInfoDiv.innerText = `Ошибка: ${error.message}`;
          });
      });

      // Запись данных в БД
      document.getElementById("write-btn").addEventListener("click", () => {
        const user = auth.currentUser;
        if (!user) {
          alert("Сначала авторизуйтесь!");
          return;
        }

        set(ref(db, 'users/' + user.uid), {
          username: user.displayName || "Без имени",
          email: user.email,
          photo: user.photoURL,
          lastLogin: new Date().toString()
        })
        .then(() => alert("Данные успешно сохранены в БД!"))
        .catch((error) => console.error("Ошибка записи:", error));
      });

      // Чтение данных из БД
      document.getElementById("read-btn").addEventListener("click", () => {
        const user = auth.currentUser;
        if (!user) {
          alert("Сначала авторизуйтесь!");
          return;
        }

        const dbRef = ref(db);
        get(child(dbRef, `users/${user.uid}`))
          .then((snapshot) => {
            if (snapshot.exists()) {
              document.getElementById("db-data").textContent = JSON.stringify(snapshot.val(), null, 2);
            } else {
              document.getElementById("db-data").textContent = "Данные не найдены";
            }
          })
          .catch((error) => console.error("Ошибка чтения:", error));
      });
        // Получаем новые элементы UI
const loginBtn = document.getElementById("login-btn");
const logoutBtn = document.getElementById("logout-btn");
const userInfoDiv = document.getElementById("user-info");

// 2. ОТСЛЕЖИВАНИЕ СОСТОЯНИЯ (автоматически управляет кнопками входа/выхода)
onAuthStateChanged(auth, (user) => {
  if (user) {
    // Пользователь вошел: показываем кнопку выхода, скрываем кнопку входа
    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline-block";
    userInfoDiv.innerHTML = `
      <h3>Добро пожаловать, ${user.displayName || 'Пользователь'}!</h3>
      <p>Email: ${user.email}</p>
      <img src="${user.photoURL}" alt="Avatar" width="100">
    `;
  } else {
    // Пользователь вышел: показываем кнопку входа, скрываем кнопку выхода
    loginBtn.style.display = "inline-block";
    logoutBtn.style.display = "none";
    userInfoDiv.innerHTML = "<p>Вы не авторизованы. Пожалуйста, войдите.</p>";
  }
});

// 3. ОБРАБОТЧИК ВХОДА (упростили, так как UI теперь обновляется через onAuthStateChanged)
loginBtn.addEventListener("click", () => {
  signInWithPopup(auth, provider)
    .catch((error) => {
      console.error("Ошибка входа:", error);
      alert("Ошибка входа: " + error.message);
    });
});

// 4. ОБРАБОТЧИК ВЫХОДА
logoutBtn.addEventListener("click", () => {
  signOut(auth)
    .then(() => {
      alert("Вы успешно вышли из аккаунта!");
    })
    .catch((error) => {
      console.error("Ошибка при выходе:", error);
    });
});
    </script>
</body>
</html>

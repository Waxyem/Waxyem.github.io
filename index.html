    // Инициализация Firebase
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GithubAuthProvider();

// Получение элементов UI
const loginBtn = document.getElementById("login-btn");
const userInfoDiv = document.getElementById("user-info");

// Обработчик клика для входа
loginBtn.addEventListener("click", () => {
  signInWithPopup(auth, provider)
    .then((result) => {
      // Пользователь успешно вошел
      const user = result.user;
      
      // Дополнительно можно получить GitHub Access Token, если вам нужен доступ к GitHub API:
      const credential = GithubAuthProvider.credentialFromResult(result);
      const token = credential.accessToken;

      userInfoDiv.innerHTML = `
        <h3>Добро пожаловать, ${user.displayName || 'Пользователь'}!</h3>
        <p>Email: ${user.email}</p>
        <img src="${user.photoURL}" alt="Avatar" width="100">
      `;
      console.log("Данные пользователя:", user);
    })
    .catch((error) => {
      // Обработка ошибок
      console.error("Ошибка при авторизации:", error.code, error.message);
      userInfoDiv.innerText = `Ошибка: ${error.message}`;
    });
});




    // 1. ЗАПИСЬ В БД (сохраняем профиль вошедшего пользователя)
document.getElementById("write-btn").addEventListener("click", () => {
  const user = auth.currentUser;
  if (!user) {
    alert("Сначала авторизуйтесь!");
    return;
  }

  // Записываем данные по пути users/UID_пользователя
  set(ref(db, 'users/' + user.uid), {
    username: user.displayName || "Без имени",
    email: user.email,
    photo: user.photoURL,
    lastLogin: new Date().toString()
  })
  .then(() => {
    alert("Данные успешно сохранены в БД!");
  })
  .catch((error) => {
    console.error("Ошибка записи:", error);
  });
});

// 2. ЧТЕНИЕ ИЗ БД
document.getElementById("read-btn").addEventListener("click", () => {
  const user = auth.currentUser;
  if (!user) {
    alert("Сначала авторизуйтесь!");
    return;
  }

  const dbRef = ref(db);
  // Читаем данные из ветки users/UID_пользователя
  get(child(dbRef, `users/${user.uid}`))
    .then((snapshot) => {
      if (snapshot.exists()) {
        const data = snapshot.val();
        document.getElementById("db-data").textContent = JSON.stringify(data, null, 2);
      } else {
        document.getElementById("db-data").textContent = "Данные не найдены в БД";
      }
    })
    .catch((error) => {
      console.error("Ошибка чтения:", error);
    });
});
</script>
    <button id="write-btn">Записать в БД</button>
<button id="read-btn">Прочитать из БД</button>
<pre id="db-data" style="background: #f0f0f0; padding: 10px; margin-top: 10px;"></pre>
